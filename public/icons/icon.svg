<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.5"/>
  <rect x="32" y="32" width="448" height="448" rx="92" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Antenna -->
  <line x1="256" y1="120" x2="256" y2="70" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="60" r="16" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Ears / Servo Pods -->
  <rect x="76" y="210" width="24" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <rect x="412" y="210" width="24" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>

  <!-- Robot Head Chassis -->
  <rect x="96" y="120" width="320" height="240" rx="44" fill="#0f172a" stroke="#38bdf8" stroke-width="5" filter="url(#glow)"/>

  <!-- OLED Screen Inset -->
  <rect x="124" y="148" width="264" height="184" rx="28" fill="#020617" stroke="#334155" stroke-width="3"/>

  <!-- Cute Expressive Cyber Eyes -->
  <!-- Left Eye -->
  <path d="M 160 216 Q 192 186 224 216" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <!-- Right Eye -->
  <path d="M 288 216 Q 320 186 352 216" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#glow)"/>

  <!-- Cheek Blushes -->
  <circle cx="170" cy="272" r="10" fill="#f43f5e" opacity="0.65"/>
  <circle cx="342" cy="272" r="10" fill="#f43f5e" opacity="0.65"/>

  <!-- Robot Mouth / Smirk -->
  <path d="M 236 270 Q 256 286 276 270" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- AVENTO Branding Badge -->
  <rect x="180" y="396" width="152" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="256" y="424" fill="#38bdf8" font-family="monospace, sans-serif" font-weight="900" font-size="20" letter-spacing="4" text-anchor="middle">AVENTO</text>
  <circle cx="198" cy="417" r="4" fill="#34d399"/>
</svg>
